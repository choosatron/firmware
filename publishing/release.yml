# Choosatron firmware release.
#
# THIS FILE BELONGS IN THE PRIVATE SOURCE REPOSITORY, at
# .github/workflows/release.yml. It lives here so the whole publishing recipe is
# in one place; move or copy it when you set the repositories up.
#
# Triggered by pushing a version tag. Builds, signs, verifies, then publishes to
# the public artifact repository (this one) in two commits - artifacts first,
# manifest second. See README.md, rule 2.
#
# Required secrets in the SOURCE repository:
#   FIRMWARE_SIGNING_KEY  the RSA-3072 PEM used to sign app images. Without the
#                         matching key, every device already running signed
#                         firmware will refuse the update.
#   FIRMWARE_REPO_TOKEN   fine-grained PAT scoped to choosatron/firmware only,
#                         Contents: read and write.

name: Release firmware

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4

    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # PROJECT_VER derives -dev.N from tag distance

      # A tag of v1.1.0 publishes to stable; v1.1.0-beta.2 publishes to beta.
      # That matches SemVer, where a pre-release sorts below the release of the
      # same number - which is exactly how the device compares them.
      - name: Work out the version and channel
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then CHANNEL=beta; else CHANNEL=stable; fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION to the $CHANNEL channel."

      # version.txt is the single source of truth; the tag is derived from it.
      # Catching a disagreement here is the difference between a failed build and
      # a published release nobody can cleanly retract.
      - name: version.txt matches the tag
        shell: bash
        run: |
          FILE="$(tr -d '[:space:]' < choosatron/version.txt)"
          BASE="${{ steps.ver.outputs.version }}"
          BASE="${BASE%%-*}"   # strip any -beta.N; version.txt holds MAJOR.MINOR.PATCH
          if [ "$FILE" != "$BASE" ]; then
            echo "::error::choosatron/version.txt says '$FILE' but the tag says '$BASE'."
            exit 1
          fi

      - name: This version is not already published
        shell: bash
        run: |
          curl -sf https://choosatron.github.io/firmware/manifest.json -o old.json || exit 0
          if jq -e --arg v "${{ steps.ver.outputs.version }}" \
               '.channels[]? | select(.version == $v)' old.json > /dev/null; then
            echo "::error::${{ steps.ver.outputs.version }} is already in the published manifest."
            exit 1
          fi

      # Without this the app image is unsigned, and every device already running
      # signed firmware silently refuses it - a failure that only shows up in the
      # field. See docs/ota-update-spec.md 10.2.
      - name: Restore the signing key
        shell: bash
        run: |
          printf '%s' "${{ secrets.FIRMWARE_SIGNING_KEY }}" > choosatron/secure_boot_signing_key.pem
          test -s choosatron/secure_boot_signing_key.pem

      # data/generated/ is gitignored, so the embedded web UI does not exist in a
      # fresh checkout. Building without this step would ship the previous page,
      # or fail to link at all.
      - name: Build the web assets
        shell: bash
        run: python3 choosatron/tools/01_gzip_web_data.py

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd choosatron && idf.py build

      - name: The image is signed with our key
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          espsecure.py verify_signature --version 2 \
            --keyfile choosatron/secure_boot_signing_key.pem \
            choosatron/build/choosatron.bin

      - name: Build the factory image for USB recovery
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd choosatron/build
          esptool.py --chip esp32s3 merge_bin -o choosatron-factory.bin @flash_args

      - name: Check out the artifact repository
        uses: actions/checkout@v4
        with:
          repository: choosatron/firmware
          token: ${{ secrets.FIRMWARE_REPO_TOKEN }}
          path: firmware-out

      # One implementation of the publishing rules, called from here rather than
      # duplicated into this file. It also re-verifies that the version embedded
      # in the binary matches what is being published.
      - name: Stage the release
        shell: bash
        run: |
          python3 firmware-out/publishing/publish_release.py \
            --repo-root firmware-out \
            --version "${{ steps.ver.outputs.version }}" \
            --channel "${{ steps.ver.outputs.channel }}" \
            --bin choosatron/build/choosatron.bin \
            --factory-bin choosatron/build/choosatron-factory.bin \
            --notes-url "https://github.com/choosatron/firmware/releases/tag/${{ steps.ver.outputs.tag }}"

      # TWO commits, artifacts first. The manifest is what announces the release;
      # if it lands before the binary is live, a device checking in that window
      # follows a URL to a partial file.
      - name: Publish the artifacts
        working-directory: firmware-out
        shell: bash
        run: |
          git config user.name  "choosatron-release"
          git config user.email "release@choosatron.invalid"
          git add "${{ steps.ver.outputs.version }}"
          git commit -m "Add ${{ steps.ver.outputs.version }} artifacts"
          git push

      - name: Confirm the binary is actually reachable
        shell: bash
        run: |
          URL="https://choosatron.github.io/firmware/${{ steps.ver.outputs.version }}/choosatron.bin"
          for i in $(seq 1 30); do
            if curl -sfI "$URL" > /dev/null; then echo "Live: $URL"; exit 0; fi
            echo "Waiting for Pages to publish ($i/30)..."
            sleep 20
          done
          echo "::error::$URL did not go live. The manifest was NOT updated, so nothing is announced."
          exit 1

      - name: Announce it in the manifest
        working-directory: firmware-out
        shell: bash
        run: |
          git add manifest.json
          git commit -m "Publish ${{ steps.ver.outputs.version }} to ${{ steps.ver.outputs.channel }}"
          git push

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: choosatron/firmware
          token: ${{ secrets.FIRMWARE_REPO_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Choosatron ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.channel == 'beta' }}
          files: |
            choosatron/build/choosatron.bin
            choosatron/build/choosatron-factory.bin
          body: |
            Choosatron firmware ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.channel }} channel).

            Devices update themselves from the manifest — nothing here needs to be
            downloaded by hand. These files are attached for USB recovery and for
            anyone who wants them.

            - `choosatron.bin` — the over-the-air image
            - `choosatron-factory.bin` — merged bootloader + partition table + app, for USB

            > Note for tooling: do not point `manifest.json` at these release-asset
            > URLs. They are served without CORS headers, so the device's own update
            > page cannot read them. The manifest points at GitHub Pages instead.
